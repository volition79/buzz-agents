name: Build and publish reviewed portal candidate
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate the public URL artifact without rebuilding images
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
concurrency:
  group: portal-candidate-publication
  cancel-in-progress: false
jobs:
  url-install:
    if: ${{ inputs.verify_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Regression tests for URL installation source
        run: python3 -m unittest discover -s tests -p test_portal_release.py -v
      - name: Fetch public Raw URL and start exact downloaded Compose
        env:
          # Anonymous image pull, no registry login in this job.
          INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml
        run: python3 scripts/verify-url-install.py --url "$INSTALL_URL" --start
  candidate:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify complete public provider upgrade history
        run: python3 scripts/provider-history.py --check --download-dir /tmp/buzz-provider-history
      - name: Build Windows candidate and run scoped tests
        shell: bash
        run: |
          python3 scripts/build-portal.py
          npm ci --ignore-scripts --no-audit --no-fund
          sudo env "PATH=$PATH" python3 -m unittest discover -s tests -v
          for module in web-provider connect; do
            (cd "$module" && BUZZ_PROVIDER_HISTORY_DIR=/tmp/buzz-provider-history go test -race ./... && go vet ./...)
          done
          node --check buzz_agents/web/app.js
          node --check buzz_agents/web/i18n.js
      - name: Browser setup through retained two-slot route
        run: |
          python3 -m pip install websocket-client==1.9.0
          python3 scripts/verify-portal-route-browser.py
          python3 scripts/verify-bot-update-browser.py
      - name: Build runtime, portal and broker from the same reviewed source
        shell: bash
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> "$GITHUB_ENV"
          docker build -f Dockerfile --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE_PREFIX-runtime:$GITHUB_SHA" .
          docker build -f Dockerfile.portal --target broker --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE_PREFIX-broker:$GITHUB_SHA" .
          docker build -f Dockerfile.portal --target portal --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE_PREFIX-portal:$GITHUB_SHA" .
          # A loopback-only registry supplies immutable references before public publication.
          docker run -d --name buzz-ci-registry -p 127.0.0.1:80:5000 registry:2.8.3
          docker tag "$IMAGE_PREFIX-portal:$GITHUB_SHA" "localhost/buzz-agents-portal:$GITHUB_SHA"
          docker push "localhost/buzz-agents-portal:$GITHUB_SHA"
          echo "BUZZ_PORTAL_IMAGE=$(docker image inspect "localhost/buzz-agents-portal:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
          docker tag "$IMAGE_PREFIX-runtime:$GITHUB_SHA" "localhost/buzz-agents-runtime:$GITHUB_SHA"
          docker push "localhost/buzz-agents-runtime:$GITHUB_SHA"
          echo "BUZZ_RUNTIME_IMAGE=$(docker image inspect "localhost/buzz-agents-runtime:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Pull exact candidate images
        run: |
          docker pull "$BUZZ_RUNTIME_IMAGE"
          docker pull "$BUZZ_PORTAL_IMAGE"
      - name: Automatic startup without domain environment
        shell: bash
        run: |
          export BUZZ_BROKER_IMAGE="$IMAGE_PREFIX-broker:$GITHUB_SHA"
          python3 scripts/verify-bootstrap-docker.py --compose compose.portal.yaml
          python3 scripts/verify-bootstrap-docker.py --compose compose.portal.yaml --host-proxy
          python3 scripts/verify-bootstrap-docker.py --compose compose.portal.yaml --host-proxy --legacy-upgrade
          python3 scripts/verify-bootstrap-docker.py --compose compose.portal.yaml --host-proxy --portal-upgrade
      - name: Existing bot update preserves identity and files
        run: sudo env "PATH=$PATH" "BUZZ_RUNTIME_IMAGE=$BUZZ_RUNTIME_IMAGE" python3 scripts/verify-bot-update-docker.py
      - name: Publish reviewed images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX-runtime:$GITHUB_SHA"
          RUNTIME_REF=$(docker image inspect "$IMAGE_PREFIX-runtime:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk '/^ghcr.io\// {print; exit}')
          export BUZZ_RUNTIME_IMAGE="$RUNTIME_REF"
          echo "BUZZ_RUNTIME_IMAGE=$RUNTIME_REF" >> "$GITHUB_ENV"
          docker push "$IMAGE_PREFIX-broker:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX-portal:$GITHUB_SHA"
          PORTAL_REF=$(docker image inspect "$IMAGE_PREFIX-portal:$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk '/^ghcr.io\// {print; exit}')
          echo "BUZZ_PORTAL_IMAGE=$PORTAL_REF" >> "$GITHUB_ENV"
          python3 scripts/render-portal-release.py \
            --runtime "$BUZZ_RUNTIME_IMAGE" \
            --broker "$(docker image inspect "$IMAGE_PREFIX-broker:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')" \
            --portal "$PORTAL_REF" \
            --output dist/portal-v0.4/compose.install.yaml
      - name: Require anonymous image access before issuing install URL
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          prefix=os.environ['IMAGE_PREFIX'].removeprefix('ghcr.io/')
          for role in ('runtime','broker','portal'):
              image=prefix+'-'+role
              ref=os.environ['GITHUB_SHA'] if role=='broker' else os.environ['BUZZ_'+role.upper()+'_IMAGE'].split('@')[1]
              url='https://ghcr.io/token?service=ghcr.io&scope=repository:'+image+':pull'
              try:
                  with urllib.request.urlopen(url,timeout=30) as response: token=json.load(response)['token']
                  request=urllib.request.Request('https://ghcr.io/v2/'+image+'/manifests/'+ref,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'})
                  with urllib.request.urlopen(request,timeout=30) as response: assert response.status==200
              except Exception:
                  raise SystemExit('Set this GHCR package to Public in GitHub package settings, then rerun: '+image)
          PY
      - name: Create candidate release with concrete install Compose
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/render-portal-release.py --list-assets --output dist/portal-v0.4/compose.install.yaml > /tmp/buzz-release-assets.txt
          mapfile -t RELEASE_ASSETS < /tmp/buzz-release-assets.txt
          RELEASE_TAG="portal-candidate-${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Buzz portal v0.4 candidate" --notes-file docs/PORTAL-VERIFICATION.md \
            "${RELEASE_ASSETS[@]}"
          echo "New image candidate Compose (requires review before replacing canonical docker-compose.yml): https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/compose.install.yaml" >> "$GITHUB_STEP_SUMMARY"
