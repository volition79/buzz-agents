# Release template: publish reviewed images, then set their immutable references.
# Existing Hostinger Traefik and Buzz Relay are prerequisites; neither is replaced.
services:
  runtime-image:
    image: ghcr.io/volition79/buzz-agents-runtime@sha256:76ff5893e23ed743c5b83a0d1c6dfd1d5a2a8ffba75ebccbfb8f07622e1c954b
    entrypoint: ["python", "-c", "print('Runtime image ready')"]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 64m
    pids_limit: 16
  broker:
    image: ghcr.io/volition79/buzz-agents-broker@sha256:b38d1e1cf352c0710471aee2f148f8e56144d19a1f7be236023710ad175dff2e
    depends_on:
      runtime-image:
        condition: service_completed_successfully
    environment:
      BUZZ_RUNTIME_IMAGE: ghcr.io/volition79/buzz-agents-runtime@sha256:76ff5893e23ed743c5b83a0d1c6dfd1d5a2a8ffba75ebccbfb8f07622e1c954b
    network_mode: none
    user: "0:0"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 256m
    pids_limit: 96
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=4m"]
    volumes:
      - /docker/${COMPOSE_PROJECT_NAME:?Compose project name is required}:/docker/${COMPOSE_PROJECT_NAME:?Compose project name is required}
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/buzz-agents-v2:/var/lib/buzz-agents-v2
      - /var/lib/buzz-agents-easy-scheduler:/var/lib/buzz-agents-easy-scheduler
      - control:/control
      - rpc:/rpc
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  portal:
    image: ghcr.io/volition79/buzz-agents-portal@sha256:50d1c772c088d27c183212fa02ff56f913744582c8f9d3ecac969388da9d2f4d
    depends_on: [broker]
    user: "10002:10002"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 48
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - portal:/portal
      - rpc:/rpc
    labels:
      - traefik.enable=false
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  control:
  rpc:
  portal:
