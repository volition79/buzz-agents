# Release template: publish reviewed images, then set their immutable references.
# Existing Hostinger Traefik and Buzz Relay are prerequisites; neither is replaced.
services:
  runtime-image:
    image: ghcr.io/volition79/buzz-agents-runtime@sha256:01d00dd2e4dbcb11f3262e446ae43b51759c779a028077c0e3d142b4c44c2552
    entrypoint: ["python", "-c", "print('Runtime image ready')"]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 64m
    pids_limit: 16
  broker:
    image: ghcr.io/volition79/buzz-agents-broker@sha256:a5a8f98c4b6d58a49b4ff4ae8f0b3838d7dabdec0831b5207e0fd14e02abb7e0
    depends_on:
      runtime-image:
        condition: service_completed_successfully
    environment:
      BUZZ_RUNTIME_IMAGE: ghcr.io/volition79/buzz-agents-runtime@sha256:01d00dd2e4dbcb11f3262e446ae43b51759c779a028077c0e3d142b4c44c2552
    network_mode: none
    user: "0:0"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 256m
    pids_limit: 96
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=4m"]
    volumes:
      - /docker/${COMPOSE_PROJECT_NAME:?Compose project name is required}:/docker/${COMPOSE_PROJECT_NAME:?Compose project name is required}
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/buzz-agents-v2:/var/lib/buzz-agents-v2
      - /var/lib/buzz-agents-easy-scheduler:/var/lib/buzz-agents-easy-scheduler
      - control:/control
      - rpc:/rpc
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  portal:
    image: ghcr.io/volition79/buzz-agents-portal@sha256:852fd1a7475ca22c4890bbc32699c3c36bd4bd5e6d2d4f2c634ab1d6c36c987b
    depends_on: [broker]
    user: "10002:10002"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 48
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - portal:/portal
      - rpc:/rpc
    labels:
      - traefik.enable=false
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  control:
  rpc:
  portal:
