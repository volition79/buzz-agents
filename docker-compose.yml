# Release template: publish reviewed images, then set their immutable references.
# Existing Hostinger Traefik and Buzz Relay are prerequisites; neither is replaced.
services:
  runtime-image:
    image: ghcr.io/volition79/buzz-agents-runtime@sha256:810a1205799fc153afffb9c712e60b608bfd9a10fa96dc1f207bb22c6e885b45
    entrypoint: ["python", "-c", "print('Runtime image ready')"]
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 64m
    pids_limit: 16
  broker:
    image: ghcr.io/volition79/buzz-agents-broker@sha256:054cd17863c65a1b760915e27d96079da3adc56bc26d85c40510790745447de2
    depends_on:
      runtime-image:
        condition: service_completed_successfully
    environment:
      BUZZ_RUNTIME_IMAGE: ghcr.io/volition79/buzz-agents-runtime@sha256:810a1205799fc153afffb9c712e60b608bfd9a10fa96dc1f207bb22c6e885b45
    network_mode: none
    user: "0:0"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 256m
    pids_limit: 96
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=4m"]
    volumes:
      - /docker/${COMPOSE_PROJECT_NAME:?Compose project name is required}:/docker/${COMPOSE_PROJECT_NAME:?Compose project name is required}
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/buzz-agents-v2:/var/lib/buzz-agents-v2
      - /var/lib/buzz-agents-easy-scheduler:/var/lib/buzz-agents-easy-scheduler
      - control:/control
      - rpc:/rpc
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  portal:
    image: ghcr.io/volition79/buzz-agents-portal@sha256:3baa1b7246b26a4c8849d2e49ab8dc504762fedfd2ee1e810f81ed29f00539f8
    depends_on: [broker]
    user: "10002:10002"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 48
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - portal:/portal
      - rpc:/rpc
    labels:
      - traefik.enable=false
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
volumes:
  control:
  rpc:
  portal:
